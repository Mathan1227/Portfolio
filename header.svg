<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#040507" />
      <stop offset="100%" stop-color="#0e0507" />
    </linearGradient>

    <!-- Crimson Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#040507" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#dc2626" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.45; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-layer {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .beacon {
      animation: beaconBlink 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Container -->
  <rect x="2" y="2" width="896" height="196" rx="14" fill="url(#bgGradient)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Ambient Crimson Glow Core -->
  <ellipse cx="450" cy="100" rx="360" ry="85" fill="url(#centerGlow)" class="pulse-layer" />

  <!-- Decorative Corner Cyber Accents -->
  <path d="M 12 28 L 28 12" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 888 28 L 872 12" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 12 172 L 28 188" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 888 172 L 872 188" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Top Micro-Badge: System Status -->
  <g transform="translate(450, 42)">
    <rect x="-140" y="-14" width="280" height="24" rx="12" fill="#11141a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="-116" cy="-2" r="4.5" fill="#10b981" class="beacon" />
    <circle cx="-116" cy="-2" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="8" y="2" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="2">
      ENGINEERING PORTFOLIO <tspan fill="#dc2626">•</tspan> LIVE
    </text>
  </g>

  <!-- Main Headline: MATHAN DINESH -->
  <text x="450" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4" filter="url(#neonShadow)">
    MATHAN DINESH
  </text>

  <!-- Subtitle Tagline: Full-Stack Developer & AI Systems Engineer -->
  <text x="450" y="146" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" font-size="14.5" fill="#dc2626" letter-spacing="3">
    FULL-STACK DEVELOPER <tspan fill="#ffffff" fill-opacity="0.4">|</tspan> AI &amp; COMPUTER VISION ENGINEER
  </text>

  <!-- Bottom Interactive Cue -->
  <text x="450" y="174" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    ✦ Sri Ramakrishna Engineering College (SREC '26) • Tap Anywhere To Open ✦
  </text>
</svg>
